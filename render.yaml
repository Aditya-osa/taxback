services:
  # Web Service
  - type: web
    name: taxlegal-backend
    runtime: docker
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: taxlegal-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: taxlegal-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: taxlegal-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: taxlegal-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: taxlegal-db
          property: password

databases:
  # PostgreSQL Database
  - name: taxlegal-db
    databaseName: taxlegal_blog
    user: taxlegal_user
    plan: free
